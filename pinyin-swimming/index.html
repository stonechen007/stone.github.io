<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>拼音游泳赛</title>
    <style>
      :root {
        --navy: #243959;
        --sky: #e7f7ff;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
        color: var(--navy);
        background: #eff8ff;
      }
      button,
      select,
      input {
        font: inherit;
      }
      button {
        cursor: pointer;
      }
      button:focus-visible {
        outline: 4px solid #f0a600;
        outline-offset: 2px;
      }
      .setup {
        max-width: 1400px;
        margin: auto;
        padding: 20px;
      }
      .header {
        background: linear-gradient(120deg, #326cc5, #56c0db);
        padding: 18px 24px;
        color: white;
        border-radius: 20px;
        margin-bottom: 14px;
      }
      .header h1 {
        margin: 0;
        font-size: 32px;
      }
      .header p {
        margin: 7px 0 0;
      }
      .panel {
        background: #fff;
        border: 2px solid #cce6f4;
        border-radius: 18px;
        padding: 16px 20px;
        margin: 12px 0;
        box-shadow: 0 3px 0 #d3eaf5;
      }
      .panel h2 {
        margin: 0 0 10px;
        font-size: 21px;
      }
      .row {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 10px;
      }
      .row label {
        display: flex;
        gap: 6px;
        align-items: center;
      }
      select,
      input[type="text"] {
        padding: 8px;
        border-radius: 9px;
        border: 1px solid #bcd5e4;
      }
      .btn {
        border: 0;
        background: #e7f2fa;
        border-radius: 10px;
        padding: 8px 12px;
        color: #274968;
        font-weight: bold;
      }
      .btn.primary {
        background: #e85a55;
        color: #fff;
      }
      .btn.play {
        background: #377dca;
        color: white;
      }
      .btn.small {
        padding: 5px 8px;
        font-size: 13px;
      }
      .lesson-buttons {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin: 10px 0;
      }
      .lesson-buttons button.active {
        background: #3577c8;
        color: white;
      }
      .bank,
      .custom-list {
        max-height: 270px;
        overflow: auto;
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(195px, 1fr));
        gap: 6px;
        margin-top: 10px;
      }
      .item {
        border: 1px solid #dce9f0;
        background: #f8fcff;
        border-radius: 10px;
        padding: 6px;
        display: flex;
        align-items: center;
        gap: 4px;
        min-width: 0;
      }
      .item label {
        display: flex;
        align-items: center;
        flex: 1;
        min-width: 0;
        gap: 4px;
      }
      .item .py {
        overflow-wrap: anywhere;
        font-size: 20px;
      }
      .hint {
        font-size: 14px;
        line-height: 1.6;
        color: #65788b;
      }
      .error {
        color: #bb3a35;
        font-weight: bold;
      }
      .network-status {
        flex: 1 1 100%;
      }

      .active {
        background: #123857;
      }
      .active .setup {
        display: none;
      }
      .active .game {
        display: block;
      }
      .hud {
        position: absolute;
        top: 1.3%;
        right: 1.5%;
        left: 31%;
        height: 9%;
        display: flex;
        justify-content: end;
        gap: 0.45%;
        z-index: 4;
      }
      .score {
        min-width: 12%;
        max-width: 19%;
        border: 3px solid #fff;
        border-radius: 999px;
        background: var(--color);
        box-shadow: 0 3px 0 #805830;
        color: white;
        font-weight: bold;
        text-align: center;
        display: flex;
        justify-content: center;
        align-items: center;
        font-size: clamp(12px, 1.6vw, 25px);
        white-space: nowrap;
        padding: 2px 8px;
      }
      .controls {
        position: absolute;
        left: 2%;
        top: 11%;
        display: flex;
        gap: 5px;
        z-index: 6;
      }
      .controls button {
        border: 1px solid #cbdfea;
        background: #fffffff2;
        padding: 4px 9px;
        font-size: clamp(11px, 1vw, 16px);
        border-radius: 9px;
        color: #244464;
        font-weight: bold;
      }
      .progress {
        position: absolute;
        right: 3%;
        top: 12%;
        background: #ffffffdf;
        padding: 4px 12px;
        border-radius: 12px;
        font-weight: bold;
        font-size: clamp(12px, 1.2vw, 18px);
      }
      .races {
        position: absolute;
        top: 18%;
        left: 3%;
        right: 9%;
        height: 49%;
        display: block;
        z-index: 2;
        pointer-events: none;
      }
      .lane {
        position: absolute;
        left: 0;
        right: 0;
        top: var(--lane-center);
        height: 100%;
        transform: translateY(-50%);
      }
      .boat {
        position: absolute;
        top: 50%;
        height: var(--figure-height);
        width: auto;
        max-width: none;
        object-fit: contain;
        transform: translate(calc(-1 * var(--edge)), -50%);
        left: calc(12% + var(--x));
        transition: left 1s ease-in-out;
        filter: drop-shadow(0 3px 2px #12639f80);
      }
      .answer-area {
        position: absolute;
        bottom: 2%;
        left: 1%;
        right: 1%;
        height: 31%;
        display: grid;
        gap: 0.4%;
        z-index: 4;
      }
      .team {
        min-width: 0;
        border: 4px solid white;
        border-radius: 16px;
        background: var(--color);
        box-shadow: 0 4px 0 #18395e88;
        padding: 4px 6px;
        display: flex;
        flex-direction: column;
      }
      .team-head {
        text-align: center;
        color: white;
        font-weight: bold;
        font-size: clamp(12px, 1.4vw, 23px);
        height: 20%;
        line-height: 1.1;
      }
      .answers {
        flex: 1;
        min-height: 0;
        display: grid;
        gap: 5px;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        grid-template-rows: repeat(2, minmax(0, 1fr));
      }
      .answers button {
        border: 2px solid #d1dfeb;
        border-radius: 10px;
        background: #fff;
        color: #182b4b;
        font-family: ClassPinyin, "Microsoft YaHei", sans-serif;
        font-size: clamp(18px, 3vw, 46px);
        font-weight: 600;
        line-height: 1.25;
        min-width: 0;
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
        box-shadow: 0 3px 0 #22375255;
        padding: 0 4px;
      }
      .answers button.good {
        background: #d6ffd9;
        border-color: #4ac96c;
      }
      .answers button.bad {
        background: #ffe1de;
        border-color: #e95959;
      }
      .answers button:disabled {
        cursor: default;
      }
      .answer-area[data-players="1"] {
        left: 14%;
        right: 14%;
      }
      .answer-area[data-players="1"] .answers,
      .answer-area[data-players="2"] .answers {
        grid-template-columns: repeat(4, minmax(0, 1fr));
        grid-template-rows: 1fr;
      }
      .answer-area[data-players="1"] {
        height: 23%;
      }
      .answer-area[data-players="2"] {
        height: 23%;
      }
      .feedback {
        position: absolute;
        left: 35%;
        right: 35%;
        top: 13%;
        text-align: center;
        color: #633611;
        background: #fff7d8e8;
        border-radius: 10px;
        font-size: clamp(12px, 1.1vw, 18px);
        font-weight: bold;
        z-index: 4;
        pointer-events: none;
      }
      .feedback:empty {
        display: none;
      }
      .result {
        position: absolute;
        inset: 3% 4%;
        background: #fffcf2f8;
        border: 4px solid #f6c65a;
        border-radius: 22px;
        z-index: 10;
        overflow: auto;
        padding: 20px;
      }
      .result h2 {
        text-align: center;
        margin: 0 0 10px;
      }
      .result-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
        gap: 10px;
      }
      .result-team {
        background: white;
        border: 2px solid #dce8ee;
        border-radius: 12px;
        padding: 10px;
      }
      .wrong {
        border-bottom: 1px solid #e9eff2;
        padding: 6px;
      }
      .wrong .py {
        font-family: ClassPinyin, "Microsoft YaHei", sans-serif;
        font-size: 22px;
      }
      .vol {
        width: 85px;
      }
      @media (max-width: 800px) {
        .vol {
          width: 55px;
        }
        .controls {
          top: 9%;
        }
        .setup {
          padding: 8px;
        }
      }
      @font-face {
        font-family: ClassPinyin;
        src: url(assets/class-pinyin.ttf) format("truetype");
        font-weight: 400;
        font-display: swap;
      }
      .answers button {
        font-weight: 700;
        -webkit-font-smoothing: antialiased;
      }
      .answers button.long-pinyin {
        -webkit-text-stroke: 0.065em currentColor;
      }
      .answers button.short-pinyin {
        -webkit-text-stroke: 0.025em currentColor;
      }
      .answers button.long-pinyin {
        font-size: clamp(19px, 2.05vw, 42px);
        line-height: 1.1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 0.04em;
        white-space: normal;
        text-overflow: clip;
        padding: 3px 4px;
      }
      .answers button.long-pinyin .spelling-line {
        display: block;
        white-space: nowrap;
        line-height: 1.12;
        max-width: none;
      }
      .answers button.long-pinyin .spelling-result {
        font-size: 0.92em;
        line-height: 1.12;
      }
      .answers button.answer-pinyin {
        font-size: clamp(24px, 3.25vw, 60px);
        line-height: 1.2;
        font-weight: 700;
        -webkit-text-stroke: 0.025em currentColor;
        display: flex;
        align-items: center;
        justify-content: center;
        white-space: nowrap;
        text-overflow: clip;
        padding: 2px 4px;
      }
      .answers button.answer-pinyin .spelling-line {
        display: block;
        white-space: nowrap;
        line-height: 1.2;
      }
      .bank .py {
        font-family: ClassPinyin, "Microsoft YaHei", sans-serif;
        font-synthesis: none;
      }

      .game {
        background-size: cover;
        background-position: center;
      }
      .swim-title {
        position: absolute;
        top: 1%;
        left: 2%;
        color: #fff;
        font-size: clamp(18px, 2.6vw, 45px);
        font-weight: 900;
        line-height: 1.2;
        text-shadow:
          0 3px 0 #2255a1,
          2px 5px 8px #164b9877;
        z-index: 3;
        white-space: nowrap;
      }
      .hud {
        top: 2%;
        right: 2%;
        left: auto;
        gap: 0.4%;
        justify-content: flex-end;
      }
      .score {
        border: 3px solid #fff;
        background: var(--color);
        border-radius: 999px;
        box-shadow:
          inset 0 3px 8px #ffffff77,
          0 3px 0 #23568988;
        padding: 0.25em 0.7em;
      }
      .controls {
        top: 11%;
        left: 2%;
        z-index: 5;
      }
      .progress {
        top: 12%;
        right: 2%;
      }
      .feedback {
        top: 18%;
      }
      .races {
        position: absolute;
        top: 31%;
        left: 5%;
        right: 7%;
        height: 34%;
        display: block;
        z-index: 2;
        pointer-events: none;
      }
      .swim-lane {
        position: absolute;
        left: 0;
        right: 0;
        top: calc(var(--index) * 100% / var(--count));
        height: calc(100% / var(--count));
        border-bottom: clamp(3px, 0.48vw, 8px) dashed #fff;
        box-shadow: 0 3px 0 var(--team);
      }
      .swim-name {
        position: absolute;
        z-index: 2;
        top: 50%;
        left: 0;
        transform: translate(-55%, -50%);
        font-size: clamp(9px, 1vw, 17px);
        font-weight: 900;
        color: #fff;
        background: var(--team);
        border: 2px solid white;
        border-radius: 999px;
        padding: 0.15em 0.4em;
        white-space: nowrap;
      }
      .swimmer {
        position: absolute;
        left: calc(3% + var(--x));
        top: 50%;
        height: 92%;
        width: auto;
        max-width: 27%;
        object-fit: contain;
        transform: translateY(-50%);
        transition: left 1s ease-in-out;
        filter: drop-shadow(0 3px 3px #27609977);
      }
      .answer-area {
        bottom: 2%;
        height: 31%;
        z-index: 4;
      }
      .team {
        border: 3px solid white;
        border-radius: 17px;
        background: var(--color);
        box-shadow:
          inset 0 5px 10px #ffffff55,
          0 4px 0 #2068ab88;
        padding: 4px 6px;
      }
      .team-head {
        text-shadow: 0 2px 2px #17436a88;
      }
      .answers button {
        border-radius: 12px;
        box-shadow:
          inset 0 -4px 6px #d6ebfa,
          0 3px 0 #2a6dbb88;
      }

      #customSecondsLabel[hidden] {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <section class="setup" id="setup">
      <div class="header">
        <h1>🏊 拼音游泳赛</h1>
        <p>听读音，找拼音，答对让小选手向前游！</p>
      </div>
      <div class="panel">
        <h2>比赛设置</h2>
        <div class="row">
          <label
            >人数
            <select id="players">
              <option value="1">1人</option>
              <option value="2" selected>2人 PK</option>
              <option value="3">3人 PK</option>
              <option value="4">4人 PK</option>
            </select></label
          ><label
            >比赛题数
            <select id="rounds">
              <option value="10">10题</option>
              <option value="15" selected>15题</option>
              <option value="20">20题</option>
              <option value="30">30题</option>
            </select></label
          ><label
            >每题倒计时
            <select id="questionSeconds">
              <option value="5">5秒</option>
              <option value="10">10秒</option>
              <option value="15" selected>15秒</option>
              <option value="20">20秒</option>
              <option value="30">30秒</option>
              <option value="60">60秒</option>
              <option value="custom">自定义</option>
            </select></label
          ><label id="customSecondsLabel" hidden
            >自定义秒数
            <input
              id="customSeconds"
              type="number"
              min="1"
              max="600"
              step="1"
              value="15"
              style="width: 75px"
            />
            秒（1～600秒）</label
          ><label
            >读音音量
            <input
              id="voice"
              class="vol"
              type="range"
              min="0"
              max="1"
              step="0.05"
              value="1" /></label
          ><label
            >音效音量
            <input
              id="fx"
              class="vol"
              type="range"
              min="0"
              max="1"
              step="0.05"
              value="0.7"
          /></label>
        </div>
        <p class="hint">
          一题播放一个读音，拼读题显示最终音节，各队各自作答，答对选手立即向前游；每队每题答一次，倒计时结束后统一进入下一题。比赛结束后可以查看各队错题。
        </p>
      </div>
      <div class="panel">
        <h2>按课选择拼音</h2>
        <p class="hint">
          可以跨课选择，点击“试听”核对读音。部分录音仍需要试听确认；不带声调和对应的一声不会在同一题出现。
        </p>
        <div class="lesson-buttons" id="lessons"></div>
        <div class="row">
          <button class="btn" id="selectLesson">全选本课</button
          ><button class="btn" id="clearLesson">清空本课</button
          ><button class="btn" id="clearAll">清空全部</button
          ><strong id="selection"></strong>
        </div>
        <div class="bank" id="bank"></div>
      </div>
      <div class="panel">
        <h2>老师自定义题目</h2>
        <p class="hint">
          填写拼音后上传音频，或者使用麦克风录音。不会自动生成读音。自定义题目仅保存在本浏览器；换电脑使用请下载保存好的游戏文件。
        </p>
        <div class="row">
          <input
            id="customLabel"
            type="text"
            placeholder="输入拼音，例如 mā"
            maxlength="28"
          /><input id="customFile" type="file" accept="audio/*" /><button
            class="btn"
            id="record"
          >
            🎙 开始录音</button
          ><button class="btn" id="add">添加题目</button
          ><span id="recordInfo" class="hint"></span>
        </div>
        <div class="custom-list" id="customList"></div>
      </div>
      <div class="panel row">
        <button id="start" class="btn primary">▶ 开始比赛</button
        ><button id="save" class="btn play">⬇ 下载已保存设置的游戏</button
        ><span id="setupError" class="error"></span
        ><span
          id="networkStatus"
          class="hint network-status"
          aria-live="polite"
        ></span>
      </div>
    </section>
    <section class="game" id="game">
      <div class="swim-title">🫧 拼音游泳赛 🫧</div>
      <div class="hud" id="hud"></div>
      <div class="controls">
        <button id="back">返回设置</button
        ><button id="replay">🔊 再听一次</button
        ><button id="skip">下一题</button
        ><label
          class="hint"
          style="background: #fffffff0; border-radius: 8px; padding: 2px 5px"
          >读音
          <input
            id="gameVoice"
            class="vol"
            type="range"
            min="0"
            max="1"
            step="0.05"
            value="1" /></label
        ><label
          class="hint"
          style="background: #fffffff0; border-radius: 8px; padding: 2px 5px"
          >音效
          <input
            id="gameFx"
            class="vol"
            type="range"
            min="0"
            max="1"
            step="0.05"
            value="0.7"
        /></label>
      </div>
      <div class="progress" id="progress"></div>
      <div class="feedback" id="feedback"></div>
      <div class="races" id="races"></div>
      <div class="answer-area" id="answerArea"></div>
      <div id="result"></div>
    </section>
    <script type="application/json" id="saved-config">
      null
    </script>

          verified: false,
          source: "第14课 · 请试听",
          label: "t—īng—tīng",
        },
        "14:jǐng": {
          data: "assets/audio/voice-312.mp3",
          verified: false,
          source: "第14课 · 请试听",
          label: "j—ǐng—jǐng",
        },
        "14:bǐng": {
          data: "assets/audio/voice-313.mp3",
          verified: false,
          source: "第14课 · 请试听",
          label: "b—ǐng—bǐng",
        },
        "14:qīng": {
          data: "assets/audio/voice-314.mp3",
          verified: false,
          source: "第14课 · 请试听",
          label: "q—īng—qīng",
        },
        "14:sòng": {
          data: "assets/audio/voice-315.mp3",
          verified: false,
          source: "第14课 · 请试听",
          label: "s—òng—sòng",
        },
        "14:hǒng": {
          data: "assets/audio/voice-316.mp3",
          verified: false,
          source: "第14课 · 请试听",
          label: "h—ǒng—hǒng",
        },
        "14:zhōng": {
          data: "assets/audio/voice-317.mp3",
          verified: false,
          source: "第14课 · 请试听",
          label: "zh—ōng—zhōng",
        },
        "14:qióng": {
          data: "assets/audio/voice-318.mp3",
          verified: false,
          source: "第14课 · 请试听",
          label: "q—ióng—qióng",
        },
      };
      const BOATS = [
        "assets/swimmer-red.webp",
        "assets/swimmer-blue.webp",
        "assets/swimmer-yellow.webp",
        "assets/swimmer-green.webp",
      ];
      const $ = (id) => document.getElementById(id);
      const names = ["红队", "蓝队", "黄队", "绿队"],
        colors = ["#e85863", "#418de4", "#e7ac24", "#4fb59a"];
      let lesson = 1,
        selected = new Set(),
        custom = [],
        recorded = null,
        recorder = null,
        recordStream = null,
        playing = null,
        players = 2,
        round = 0,
        roundCount = 15,
        queue = [],
        scores = [],
        answered = [],
        wrong = [],
        target = null,
        locked = false,
        timer = null,
        pool = [];
      function esc(v) {
        return String(v).replace(
          /[&<>"']/g,
          (c) =>
            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#39;",
            })[c],
        );
      }
      function shuffle(v) {
        const a = [...v];
        for (let i = a.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [a[i], a[j]] = [a[j], a[i]];
        }
        return a;
      }
      function entry(k) {
        return BANK[k] || custom.find((x) => x.key === k);
      }
      function label(k) {
        let e = entry(k);
        return e ? e.label : k;
      }
      function finalLabel(k) {
        const text = label(k),
          parts = text.split("—");
        return parts.length >= 3 ? parts[parts.length - 1].trim() : text;
      }
      function keyGroup(k) {
        return finalLabel(k)
          .toLowerCase()
          .normalize("NFD")
          .replace(/\u0304/g, "")
          .normalize("NFC");
      }
      function optionsFor(k) {
        let out = [k],
          seen = new Set([keyGroup(k)]);
        for (const x of shuffle(pool)) {
          if (!seen.has(keyGroup(x))) {
            seen.add(keyGroup(x));
            out.push(x);
          }
          if (out.length === 4) break;
        }
        return out;
      }
      try {
        let embedded = JSON.parse($("saved-config").textContent);
        if (embedded) {
          custom = embedded.custom || [];
          selected = new Set(embedded.selected || []);
          $("players").value = embedded.players || "2";
          $("rounds").value = embedded.rounds || "15";
          $("questionSeconds").value = embedded.questionSeconds || "15";
          $("customSeconds").value = embedded.customSeconds || "15";
        } else {
          custom = JSON.parse(localStorage.getItem("swimmingCustom") || "[]");
          Object.keys(BANK)
            .filter((x) => x.startsWith("1:"))
            .forEach((x) => selected.add(x));
        }
      } catch (e) {
        Object.keys(BANK)
          .filter((x) => x.startsWith("1:"))
          .forEach((x) => selected.add(x));
      }
      function updateCustomSeconds() {
        $("customSecondsLabel").hidden =
          $("questionSeconds").value !== "custom";
      }
      function getQuestionSeconds() {
        return Number(
          $("questionSeconds").value === "custom"
            ? $("customSeconds").value
            : $("questionSeconds").value,
        );
      }
      $("questionSeconds").onchange = updateCustomSeconds;
      updateCustomSeconds();
      function persist() {
        try {
          localStorage.setItem("swimmingCustom", JSON.stringify(custom));
        } catch (e) {
          $("setupError").textContent = "浏览器空间不足，请使用下载保存功能。";
        }
      }
      function refresh() {
        $("lessons").innerHTML = Array.from(
          { length: 14 },
          (_, i) =>
            `<button class="btn ${lesson === i + 1 ? "active" : ""}" data-lesson="${i + 1}">第${i + 1}课</button>`,
        ).join("");
        let keys = Object.keys(BANK).filter((k) => k.startsWith(lesson + ":"));
        $("bank").innerHTML = keys
          .map(
            (k) =>
              `<div class="item"><label><input type="checkbox" data-key="${esc(k)}" ${selected.has(k) ? "checked" : ""}><span class="py">${esc(label(k))}</span></label><button class="btn small" data-audio="${esc(k)}">试听</button></div>`,
          )
          .join("");
        $("customList").innerHTML = custom
          .map(
            (x) =>
              `<div class="item"><label><input type="checkbox" data-key="${esc(x.key)}" ${selected.has(x.key) ? "checked" : ""}><span class="py">${esc(x.label)}</span></label><button class="btn small" data-audio="${esc(x.key)}">试听</button><button class="btn small" data-delete="${esc(x.key)}">删除</button></div>`,
          )
          .join("");
        $("selection").textContent = `已选 ${selected.size} 项`;
      }
      function showAudioError() {
        const message = "语音加载失败，请检查网络后重试。";
        if ($("feedback").textContent === "正在加载读音…")
          $("feedback").textContent = "";
        if ($("networkStatus").textContent === "正在加载语音…")
          $("networkStatus").textContent = "";
        if (document.body.classList.contains("active")) {
          $("feedback").textContent = message;
        } else {
          $("setupError").textContent = message;
        }
      }
      function play(k, retries = 0) {
        let e = entry(k);
        if (!e || !e.data) return;
        if (playing) {
          playing.pause();
          playing.currentTime = 0;
        }
        const audio = new Audio(e.data);
        playing = audio;
        audio.volume = +$("voice").value;
        const inGame = document.body.classList.contains("active");
        if (inGame) $("feedback").textContent = "正在加载读音…";
        else $("networkStatus").textContent = "正在加载语音…";
        const clearLoading = () => {
          if (playing !== audio) return;
          if ($("feedback").textContent === "正在加载读音…")
            $("feedback").textContent = "";
          if ($("networkStatus").textContent === "正在加载语音…")
            $("networkStatus").textContent = "";
        };
        let failed = false;
        const fail = () => {
          if (failed || playing !== audio) return;
          failed = true;
          if (e.data.startsWith("assets/") && retries < 2) {
            setTimeout(() => play(k, retries + 1), 400 * (retries + 1));
          } else {
            showAudioError();
          }
        };
        audio.addEventListener("playing", clearLoading, { once: true });
        audio.addEventListener("error", fail, { once: true });
        audio.play().then(clearLoading).catch(fail);
      }
      document.addEventListener("click", (e) => {
        let k = e.target.dataset.audio;
        if (k) play(k);
        k = e.target.dataset.delete;
        if (k) {
          custom = custom.filter((x) => x.key !== k);
          selected.delete(k);
          persist();
          refresh();
        }
      });
      document.addEventListener("change", (e) => {
        let k = e.target.dataset.key;
        if (k) {
          e.target.checked ? selected.add(k) : selected.delete(k);
          refresh();
        }
      });
      $("lessons").onclick = (e) => {
        if (e.target.dataset.lesson) {
          lesson = +e.target.dataset.lesson;
          refresh();
        }
      };
      $("selectLesson").onclick = () => {
        Object.keys(BANK)
          .filter((k) => k.startsWith(lesson + ":"))
          .forEach((k) => selected.add(k));
        refresh();
      };
      $("clearLesson").onclick = () => {
        Object.keys(BANK)
          .filter((k) => k.startsWith(lesson + ":"))
          .forEach((k) => selected.delete(k));
        refresh();
      };
      $("clearAll").onclick = () => {
        selected.clear();
        refresh();
      };
      $("record").onclick = async () => {
        if (recorder && recorder.state === "recording") {
          recorder.stop();
          return;
        }
        try {
          recordStream = await navigator.mediaDevices.getUserMedia({
            audio: true,
          });
          let parts = [];
          recorder = new MediaRecorder(recordStream);
          recorder.ondataavailable = (e) => parts.push(e.data);
          recorder.onstop = () => {
            let fr = new FileReader();
            fr.onload = () => {
              recorded = fr.result;
              $("recordInfo").textContent = "录音完成";
              $("record").textContent = "🎙 重新录音";
            };
            fr.readAsDataURL(new Blob(parts, { type: recorder.mimeType }));
            recordStream.getTracks().forEach((t) => t.stop());
          };
          recorder.start();
          $("record").textContent = "⏹ 停止录音";
          $("recordInfo").textContent = "正在录音……";
        } catch (e) {
          $("recordInfo").textContent =
            "无法使用麦克风，请允许权限或上传音频。";
        }
      };
      $("add").onclick = () => {
        let text = $("customLabel").value.trim(),
          file = $("customFile").files[0];
        if (!text || (!file && !recorded)) {
          alert("请填写拼音并上传或录制音频。");
          return;
        }
        function add(data) {
          let key = "custom:" + Date.now();
          custom.push({ key, label: text, data });
          selected.add(key);
          persist();
          recorded = null;
          $("customLabel").value = "";
          $("customFile").value = "";
          $("recordInfo").textContent = "";
          refresh();
        }
        if (file) {
          let f = new FileReader();
          f.onload = () => add(f.result);
          f.readAsDataURL(file);
        } else add(recorded);
      };
      async function fetchAsDataUrl(source) {
        if (source.startsWith("data:")) return source;
        let failure;
        for (let attempt = 0; attempt < 3; attempt++) {
          try {
            const response = await fetch(source);
            if (!response.ok) throw new Error("资源下载失败");
            const blob = await response.blob();
            return await new Promise((resolve, reject) => {
              const reader = new FileReader();
              reader.onload = () => resolve(reader.result);
              reader.onerror = () => reject(reader.error);
              reader.readAsDataURL(blob);
            });
          } catch (error) {
            failure = error;
            if (attempt < 2)
              await new Promise((resolve) =>
                setTimeout(resolve, 350 * (attempt + 1)),
              );
          }
        }
        throw failure;
      }
      $("save").onclick = async () => {
        const button = $("save");
        const originalLabel = button.textContent;
        button.disabled = true;
        button.textContent = "正在准备离线文件…";
        try {
          const clone = document.documentElement.cloneNode(true);
          const config = {
            players: $("players").value,
            rounds: $("rounds").value,
            questionSeconds: $("questionSeconds").value,
            customSeconds: $("customSeconds").value,
            selected: [...selected],
            custom,
          };
          clone.querySelector("#saved-config").textContent = JSON.stringify(
            config,
          ).replace(/</g, "\\u003c");
          clone.querySelector("#setupError").textContent = "";
          clone.querySelector("#networkStatus").textContent = "";
          let html = "<!DOCTYPE html>\n" + clone.outerHTML;
          const assetPaths = [
            ...new Set(
              [
                ...html.matchAll(/assets\/[\w./-]+\.(?:webp|jpg|png|ttf|mp3)/g),
              ].map(([path]) => path),
            ),
          ];
          const inlineAssets = new Map();
          for (let offset = 0; offset < assetPaths.length; offset += 4) {
            const batch = await Promise.all(
              assetPaths
                .slice(offset, offset + 4)
                .map(async (path) => [path, await fetchAsDataUrl(path)]),
            );
            batch.forEach(([path, data]) => inlineAssets.set(path, data));
            $("networkStatus").textContent =
              `正在下载离线资源 ${inlineAssets.size}/${assetPaths.length}`;
          }
          html = html.replace(
            /assets\/[\w./-]+\.(?:webp|jpg|png|ttf|mp3)/g,
            (path) => inlineAssets.get(path) || path,
          );
          const url = URL.createObjectURL(
            new Blob([html], { type: "text/html;charset=utf-8" }),
          );
          const link = document.createElement("a");
          link.href = url;
          link.download = "拼音游泳赛_我的设置.html";
          link.click();
          setTimeout(() => URL.revokeObjectURL(url), 5000);
          $("networkStatus").textContent = "离线游戏文件已生成。";
        } catch {
          $("networkStatus").textContent =
            "离线文件准备失败，请检查网络后重试。";
        } finally {
          button.disabled = false;
          button.textContent = originalLabel;
        }
      };
      function formatSpelling(text) {
        const parts = text.split("—");
        if (parts.length >= 3) {
          const result = parts.pop();
          return `<span class="spelling-line">${esc(parts.join("—"))}</span><span class="spelling-line spelling-result">→ ${esc(result)}</span>`;
        }
        return `<span class="spelling-line">${esc(text)}</span>`;
      }
      function fitSpelling() {
        document
          .querySelectorAll(".answers button.answer-pinyin")
          .forEach((button) => {
            button.style.removeProperty("font-size");
            let n = parseFloat(getComputedStyle(button).fontSize);
            const lines = [...button.querySelectorAll(".spelling-line")];
            while (
              n > 13 &&
              (lines.some((x) => x.scrollWidth > button.clientWidth - 8) ||
                button.scrollHeight > button.clientHeight)
            ) {
              n -= 1;
              button.style.fontSize = n + "px";
            }
          });
      }
      function sound(ok) {
        const volume = +$("fx").value;
        if (!volume) return;
        try {
          let ctx = new (window.AudioContext || window.webkitAudioContext)(),
            t = ctx.currentTime;
          [0, 1].forEach((i) => {
            let o = ctx.createOscillator(),
              g = ctx.createGain();
            o.type = "sine";
            o.frequency.value = ok ? (i ? 830 : 660) : i ? 190 : 230;
            g.gain.setValueAtTime(volume * 0.12, t + i * 0.09);
            g.gain.exponentialRampToValueAtTime(0.001, t + i * 0.09 + 0.16);
            o.connect(g);
            g.connect(ctx.destination);
            o.start(t + i * 0.09);
            o.stop(t + i * 0.09 + 0.16);
          });
          setTimeout(() => ctx.close(), 600);
        } catch (e) {}
      }
      $("start").onclick = () => {
        let seconds = getQuestionSeconds();
        if (!Number.isInteger(seconds) || seconds < 1 || seconds > 600) {
          $("setupError").textContent = "请输入1～600之间的整数秒数。";
          return;
        }
        let uniq = new Map();
        for (let k of selected) {
          let e = entry(k);
          if (e && e.data && !uniq.has(finalLabel(k)))
            uniq.set(finalLabel(k), k);
        }
        pool = [...uniq.values()];
        if (new Set(pool.map(keyGroup)).size < 2) {
          $("setupError").textContent =
            "请选择至少两个读音不同、有音频的题目。";
          return;
        }
        $("setupError").textContent = "";
        players = +$("players").value;
        roundCount = +$("rounds").value;
        queue = [];
        while (queue.length < roundCount) queue.push(...shuffle(pool));
        queue = queue.slice(0, roundCount);
        scores = Array(players).fill(0);
        wrong = Array.from({ length: players }, () => []);
        round = 0;
        document.body.classList.add("active");
        $("result").innerHTML = "";
        next();
      };
      function renderRace() {
        let end = Math.max(1, roundCount);
        $("hud").innerHTML = scores
          .map(
            (n, i) =>
              `<div class="score" style="--color:${colors[i]}">${players === 1 ? "我的得分" : names[i]} ${n}</div>`,
          )
          .join("");
        $("races").innerHTML = scores
          .map(
            (n, i) =>
              `<div class="swim-lane" style="--index:${i};--count:${players};--team:${colors[i]}"><span class="swim-name">${players === 1 ? "我" : names[i]}</span><img class="swimmer" id="boat${i}" src="${BOATS[i]}" alt="${names[i]}游泳" style="--x:${Math.min(64, Math.round((n / end) * 64))}%"></div>`,
          )
          .join("");
      }

      function next() {
        clearInterval(timer);
        timer = null;
        if (round >= queue.length) {
          finish();
          return;
        }
        target = queue[round];
        answered = Array(players).fill(false);
        locked = false;
        $("feedback").textContent = "";
        renderRace();
        let choices = optionsFor(target);
        $("answerArea").dataset.players = players;
        $("answerArea").style.gridTemplateColumns =
          `repeat(${players},minmax(0,1fr))`;
        $("answerArea").innerHTML = Array.from(
          { length: players },
          (_, i) =>
            `<div class="team" style="--color:${colors[i]}"><div class="team-head">${players === 1 ? "请选择" : names[i] + "答题"}</div><div class="answers">${shuffle(
              choices,
            )
              .map(
                (k) =>
                  `<button class="answer-pinyin" data-team="${i}" data-answer="${esc(k)}" aria-label="${esc(finalLabel(k))}"><span class="spelling-line">${esc(finalLabel(k))}</span></button>`,
              )
              .join("")}</div></div>`,
        ).join("");
        requestAnimationFrame(fitSpelling);
        round++;
        play(target);
        const deadline = Date.now() + getQuestionSeconds() * 1000;
        function updateTimer() {
          const left = Math.max(0, Math.ceil((deadline - Date.now()) / 1000));
          $("progress").textContent =
            `第 ${round} / ${roundCount} 题　⏱ ${left} 秒`;
          if (left === 0) {
            clearInterval(timer);
            timer = null;
            locked = true;
            next();
          }
        }
        updateTimer();
        if (!locked) timer = setInterval(updateTimer, 200);
      }
      $("answerArea").onclick = (e) => {
        let b = e.target.closest("button");
        if (!b || locked || b.disabled) return;
        let i = +b.dataset.team;
        if (answered[i]) return;
        let ok = b.dataset.answer === target;
        answered[i] = true;
        sound(ok);
        b.classList.add(ok ? "good" : "bad");
        b.parentNode
          .querySelectorAll("button")
          .forEach((x) => (x.disabled = true));
        if (ok) {
          scores[i]++;
          $("hud").children[i].textContent =
            `${players === 1 ? "我的得分" : names[i]} ${scores[i]}`;
          $("boat" + i).style.setProperty(
            "--x",
            Math.min(64, Math.round((scores[i] / roundCount) * 64)) + "%",
          );
        } else {
          wrong[i].push({ target, chosen: b.dataset.answer, round });
        }
      };
      function finish() {
        locked = true;
        let best = Math.max(...scores),
          winners = scores
            .map((s, i) => (s === best ? names[i] : null))
            .filter(Boolean);
        $("progress").textContent = "比赛结束";
        $("feedback").textContent = "";
        $("result").innerHTML =
          `<div class="result"><h2>🏆 比赛结束</h2><p style="text-align:center;font-size:22px">${players === 1 ? "我的得分：" + scores[0] : winners.join("、") + "领先！"}　${scores.map((s, i) => `${players === 1 ? "" : names[i] + " "}${s}分`).join("　")}</p><div class="result-grid">${wrong.map((items, i) => `<div class="result-team"><strong>${players === 1 ? "我的错题" : names[i] + "错题"}（${items.length}）</strong>${items.length ? items.map((x) => `<div class="wrong"><span class="py">${esc(finalLabel(x.target))}</span> <button class="btn small" data-audio="${esc(x.target)}">试听</button><div class="hint">误选：${esc(finalLabel(x.chosen))} · 第${x.round}题</div></div>`).join("") : '<p class="hint">暂无错题</p>'}</div>`).join("")}</div><p class="hint">未作答的队伍不计错。</p><button class="btn primary" onclick="document.getElementById('back').click()">返回设置</button></div>`;
      }
      $("back").onclick = () => {
        clearInterval(timer);
        timer = null;
        locked = true;
        if (playing) playing.pause();
        document.body.classList.remove("active");
        $("result").innerHTML = "";
      };
      $("replay").onclick = () => play(target);
      $("skip").onclick = () => {
        if (round < queue.length || !$("result").innerHTML) next();
      };
      $("gameVoice").oninput = (e) => ($("voice").value = e.target.value);
      $("gameFx").oninput = (e) => ($("fx").value = e.target.value);
      $("voice").oninput = (e) => ($("gameVoice").value = e.target.value);
      $("fx").oninput = (e) => ($("gameFx").value = e.target.value);
      window.addEventListener("resize", () =>
        requestAnimationFrame(fitSpelling),
      );
      window.addEventListener("offline", () => {
        $("networkStatus").textContent =
          "当前离线；已缓存内容仍可使用，未缓存语音需要联网。";
      });
      window.addEventListener("online", () => {
        $("networkStatus").textContent = "网络已恢复。";
        setTimeout(() => {
          if (
            navigator.onLine &&
            $("networkStatus").textContent === "网络已恢复。"
          )
            $("networkStatus").textContent = "";
        }, 3500);
      });
      if (!navigator.onLine)
        $("networkStatus").textContent =
          "当前离线；已缓存内容仍可使用，未缓存语音需要联网。";
      if ("serviceWorker" in navigator && location.protocol !== "file:") {
        window.addEventListener(
          "load",
          () =>
            navigator.serviceWorker.register("./sw.js").catch(() => {
              if (!$("networkStatus").textContent)
                $("networkStatus").textContent =
                  "离线缓存暂不可用，网络正常时仍可继续使用。";
            }),
          { once: true },
        );
      }
      refresh();
    </script>
  </body>
</html>
