<!DOCTYPE html>
<html lang="zh-CN">
<head>

<title>顺风出发 · Pelican Cycling Club</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Space+Grotesk:wght@400;500;700&display=swap');
:root{--ink:#203e3b;--paper:#f7f4e8;--accent:#e7754e}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:'DM Sans',sans-serif}main{max-width:1440px;margin:auto;padding:30px 5vw 24px}header{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #203e3b30;padding-bottom:20px}.brand{font-family:'Space Grotesk',sans-serif;letter-spacing:2px;font-size:12px;font-weight:700;display:flex;gap:12px;align-items:center}.seal{width:32px;height:32px;border:1px solid;border-radius:50%;display:grid;place-items:center;font-size:21px}.edition{font-size:10px;letter-spacing:2px}.intro{display:flex;justify-content:space-between;align-items:end;padding:34px 0 25px}h1{font-weight:500;font-size:clamp(32px,5vw,64px);letter-spacing:-2px;margin:0 0 9px}.sub{font-size:12px;letter-spacing:3px;color:#67817b;margin:0}.intro aside{font-size:12px;line-height:1.8;color:#67817b;text-align:right}.scene{border-radius:14px;overflow:hidden;position:relative;background:#d9e9dc;box-shadow:0 3px 0 #203e3b08}.scene>svg{display:block;width:100%;height:auto}.badge{position:absolute;top:22px;left:25px;font-size:10px;letter-spacing:2px;display:flex;align-items:center;gap:8px}.dot{height:6px;width:6px;background:#4c7c64;border-radius:50%;box-shadow:0 0 0 4px #4c7c6415}.coordinates{position:absolute;right:24px;top:24px;font-size:9px;letter-spacing:2px;color:#527369}footer{display:flex;justify-content:space-between;align-items:center;padding-top:22px;gap:18px}.caption{font-size:12px;line-height:1.8}.caption span{display:block;color:#7a8b80;font-size:10px;letter-spacing:1px}.controls{display:flex;align-items:center;gap:18px;font-size:10px;letter-spacing:1px}button{font:inherit;color:var(--ink);background:transparent;border:1px solid #203e3b40;border-radius:25px;padding:11px 20px;cursor:pointer}button:hover{background:#e5eadc}input{width:90px;accent-color:var(--ink)}.speed{display:flex;align-items:center;gap:10px}.wheel{transform-box:fill-box;transform-origin:center;animation:spin 1.35s linear infinite}.ride{animation:bob 1.35s ease-in-out infinite}.wing{transform-origin:535px 306px;animation:wing 1.35s ease-in-out infinite}.scarf{transform-origin:609px 242px;animation:flutter .7s ease-in-out infinite alternate}.clouds{animation:drift 55s linear infinite}.hills{animation:drift 35s linear infinite}.shore{animation:drift 12s linear infinite}.road{animation:drift 2.7s linear infinite}.flowers{animation:drift 5.4s linear infinite}.breeze{animation:wind 2.4s ease-in-out infinite}.paused *{animation-play-state:paused!important}@keyframes spin{to{transform:rotate(360deg)}}@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}@keyframes wing{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(3deg)}}@keyframes flutter{from{transform:rotate(-4deg)}to{transform:rotate(6deg)}}@keyframes drift{to{transform:translateX(-1200px)}}@keyframes wind{0%,100%{opacity:.2;transform:translateX(15px)}50%{opacity:.8;transform:translateX(-10px)}}@media(max-width:650px){main{padding:20px}.edition,.intro aside,.coordinates{display:none}.intro{padding:26px 0}footer{align-items:start;flex-direction:column}.badge{top:14px;left:15px;font-size:8px}.scene>svg{width:160%;max-width:none;margin-left:-30%}.controls{width:100%;justify-content:space-between}h1{letter-spacing:-1px}}
</style>

<header><div class="brand"><span class="seal">↗</span> PELICAN CYCLING CLUB</div><div class="edition">FIELD NOTES — NO. 008 / THE COASTAL RIDE</div></header>
<div class="intro"><div><h1>顺风，慢慢骑。</h1><p class="sub">NOWHERE TO BE. JUST THE SEA.</p></div><aside>一只鹈鹕，一辆单车。<br>把今天交给海风。</aside></div>

<div class="badge"><i class="dot"></i><span id="status">ON A LITTLE ADVENTURE</span></div><div class="coordinates">COASTLINE LOOP &nbsp; / &nbsp; 24° C &nbsp; ↗ NE</div>

<path d="M0 490Q600 481 1200 490V588Q600 575 0 588Z" fill="#d1c6a5"/>
<path d="M0 490Q600 481 1200 490M0 588Q600 575 1200 588" fill="none" stroke="#ece3c5" stroke-width="4"/>

<ellipse cx="590" cy="537" rx="242" ry="12" fill="#516454" opacity=".15"/>

<footer><div class="caption">目的地不重要，沿途有风就好。<span>A SMALL RIDE, A VERY GOOD DAY.</span></div><div class="controls"><label class="speed">海风速度 <input id="speed" type="range" min="0.4" max="2" step="0.1" value="1" aria-label="动画速度"><output id="speedLabel">1.0×</output></label><button id="pause" type="button" aria-pressed="false">Ⅱ &nbsp; 歇一会儿</button></div></footer>
</main>
<script>
const scene=document.getElementById('scene'),button=document.getElementById('pause'),speedInput=document.getElementById('speed');
const parts=Object.fromEntries(['farLeg','farFoot','nearLeg','nearFoot','nearPedal','crank'].map(id=>[id,document.getElementById(id)]));
let paused=false,speed=1,phase=2.3,last=0;
const point=(a)=>({x:565+30*Math.cos(a),y:449+30*Math.sin(a)});
function leg(hip,foot,bend){const dx=foot.x-hip.x,dy=foot.y-hip.y,d=Math.hypot(dx,dy),upper=78,lower=80,a=(upper*upper-lower*lower+d*d)/(2*d),h=Math.sqrt(Math.max(0,upper*upper-a*a));return{x:hip.x+a*dx/d+bend*h*dy/d,y:hip.y+a*dy/d-bend*h*dx/d};}
function draw(){const front=point(phase),back=point(phase+Math.PI);for(const [prefix,foot,hip,bend]of[['near',front,{x:526,y:337},1],['far',back,{x:546,y:326},-1]]){const knee=leg(hip,foot,bend);parts[prefix+'Leg'].setAttribute('d',`M${hip.x} ${hip.y}L${knee.x} ${knee.y}L${foot.x} ${foot.y}`);parts[prefix+'Foot'].setAttribute('d',`M${foot.x-13} ${foot.y}Q${foot.x+3} ${foot.y-6} ${foot.x+23} ${foot.y+1}L${foot.x-13} ${foot.y+4}Z`);}parts.nearPedal.setAttribute('d',`M${front.x-15} ${front.y+6}h35`);parts.crank.setAttribute('d',`M${front.x} ${front.y}L${back.x} ${back.y}`);}
function tick(t){if(last&&!paused)phase+=Math.min((t-last)/1000,.05)*Math.PI*2/1.35*speed;last=t;draw();requestAnimationFrame(tick);}requestAnimationFrame(tick);
function sync(){scene.getAnimations({subtree:true}).forEach(a=>{a.playbackRate=speed;paused?a.pause():a.play();});}
button.addEventListener('click',()=>{paused=!paused;sync();button.setAttribute('aria-pressed',String(paused));button.textContent=paused?'▶  继续出发':'Ⅱ  歇一会儿';document.getElementById('status').textContent=paused?'A MOMENT TO BREATHE':'ON A LITTLE ADVENTURE';});
speedInput.addEventListener('input',()=>{speed=Number(speedInput.value);document.getElementById('speedLabel').value=speed.toFixed(1)+'×';sync();});
</script>
</body>
